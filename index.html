<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eren Çıracıoğlu · Projects</title>
<meta name="description" content="Games, instruments, simulations and toys that run in the browser, and the Antrasit Band AI music videos.">
<meta property="og:title" content="Eren Çıracıoğlu · Projects">
<meta property="og:description" content="Games, instruments, simulations and toys that run in the browser, and the Antrasit Band AI music videos.">
<meta property="og:image" content="https://erenciracioglu-dotcom.github.io/thumbs/suluboya-atolyesi.webp">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23d9653b'/><circle cx='16' cy='16' r='6' fill='%23fbf7f0'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e8;
    --surface: #fffdf9;
    --ink: #1f1b16;
    --muted: #6d655a;
    --line: #e4dbcc;
    --accent: #c4552c;
    --accent-ink: #fff;
    --chip: #ece4d6;
    --shadow: 0 1px 2px rgba(40, 30, 15, .06), 0 8px 24px rgba(40, 30, 15, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15130f;
      --surface: #1e1b16;
      --ink: #f1ebe0;
      --muted: #a69c8d;
      --line: #322d25;
      --accent: #e57a4f;
      --accent-ink: #1a120d;
      --chip: #2a261f;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  header { padding: 56px 0 28px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 36px; }
  .who { font-weight: 600; font-size: 15px; text-decoration: none; display: flex; align-items: center; gap: 10px; }
  .who img { width: 32px; height: 32px; border-radius: 50%; background: var(--chip); }
  .lang { display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
  .lang button {
    border: 0; background: transparent; padding: 4px; border-radius: 999px; cursor: pointer; line-height: 0;
    opacity: .45; filter: grayscale(.6); transition: opacity .15s, filter .15s;
  }
  .lang button:hover { opacity: .8; filter: none; }
  .lang button[aria-pressed="true"] { opacity: 1; filter: none; box-shadow: 0 0 0 2px var(--accent); }
  .lang svg { width: 30px; height: 20px; border-radius: 4px; display: block; }
  h1 {
    font-family: Fraunces, Georgia, serif; font-weight: 600; letter-spacing: -.02em;
    font-size: clamp(36px, 6vw, 64px); line-height: 1.04; margin: 0 0 14px; max-width: 16ch;
  }
  .lede { color: var(--muted); font-size: 18px; max-width: 58ch; margin: 0; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 0 28px; }
  .filters button {
    border: 1px solid transparent; background: var(--chip); color: var(--ink); font: inherit; font-size: 14px;
    padding: 7px 14px; border-radius: 999px; cursor: pointer;
  }
  .filters button:hover { border-color: var(--line); }
  .filters button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .filters .n { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; padding-bottom: 64px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: var(--shadow);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-3px); }
  .shot { display: block; aspect-ratio: 16 / 10; background: var(--chip); overflow: hidden; position: relative; }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
  .card:hover .shot img { transform: scale(1.03); }
  .shot .ph {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: Fraunces, Georgia, serif; font-size: 28px; color: var(--muted);
  }
  .badge {
    position: absolute; top: 12px; left: 12px; background: var(--accent); color: var(--accent-ink);
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
  }
  .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .body h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 24px; margin: 0; letter-spacing: -.01em; }
  .body h2 a { text-decoration: none; }
  .body p { margin: 0; color: var(--muted); font-size: 15px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tags span { font-size: 12px; background: var(--chip); padding: 2px 9px; border-radius: 999px; color: var(--muted); }
  .actions { display: flex; gap: 10px; margin-top: auto; padding-top: 6px; }
  .btn {
    text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 10px;
    border: 1px solid var(--line);
  }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn:hover { border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 8px 0 18px; }
  .section-head h2 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: clamp(26px, 3.4vw, 36px); letter-spacing: -.01em; margin: 0; }
  .section-head a { font-size: 14px; color: var(--muted); }
  .videos { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .video .shot { aspect-ratio: 16 / 9; }
  .video .play {
    position: absolute; inset: 0; margin: auto; width: 58px; height: 40px; border-radius: 12px;
    background: rgba(20, 16, 12, .72); display: grid; place-items: center; transition: background .2s;
  }
  .video .play::after { content: ""; border-left: 15px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; margin-left: 3px; }
  .video:hover .play { background: #e0301e; }
  .video .body { padding: 14px 16px 16px; }
  .video h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .video h3 a { text-decoration: none; }
  [hidden] { display: none !important; }

  footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--muted); font-size: 14px; }
  footer a { color: var(--ink); }

  @media (max-width: 520px) {
    .wrap { padding: 0 16px; }
    header { padding-top: 28px; }
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .shot img { transition: none; }
    .card:hover { transform: none; }
    .card:hover .shot img { transform: none; }
  }
</style>
</head>
<body>
<header class="wrap">
  <div class="top">
    <a class="who" href="https://github.com/erenciracioglu-dotcom">
      <img src="https://github.com/erenciracioglu-dotcom.png?size=64" alt="" width="32" height="32">
      erenciracioglu-dotcom
    </a>
    <div class="lang" role="group" aria-label="Language / Dil">
      <button type="button" data-lang="en" title="English" aria-label="English">
        <svg viewBox="0 0 60 40" aria-hidden="true">
          <clipPath id="uk"><rect width="60" height="40"/></clipPath>
          <g clip-path="url(#uk)">
            <rect width="60" height="40" fill="#012169"/>
            <path d="M0,0 60,40M60,0 0,40" stroke="#fff" stroke-width="8"/>
            <path d="M0,0 60,40M60,0 0,40" stroke="#C8102E" stroke-width="3"/>
            <path d="M30,0V40M0,20H60" stroke="#fff" stroke-width="12"/>
            <path d="M30,0V40M0,20H60" stroke="#C8102E" stroke-width="7"/>
          </g>
        </svg>
      </button>
      <button type="button" data-lang="tr" title="Türkçe" aria-label="Türkçe">
        <svg viewBox="0 0 60 40" aria-hidden="true">
          <rect width="60" height="40" fill="#E30A17"/>
          <circle cx="22" cy="20" r="10" fill="#fff"/>
          <circle cx="24.5" cy="20" r="8" fill="#E30A17"/>
          <polygon fill="#fff" points="31.5,20 40.6,17.05 35,24.8 35,15.2 40.6,22.95"/>
        </svg>
      </button>
    </div>
  </div>
  <h1 data-i18n="title">Small worlds that run in your browser</h1>
  <p class="lede" data-i18n="lede">Games, instruments, simulations and toys. Each one opens straight in the browser, nothing to install.</p>
</header>

<main class="wrap">
  <nav class="filters" id="filters" aria-label="Filter"></nav>
  <section class="grid" id="grid" aria-live="polite"></section>
  <section id="videos-section">
    <div class="section-head">
      <h2 data-i18n="videos">Antrasit Band AI Music Videos</h2>
      <a href="https://linktr.ee/antrasit.band">linktr.ee/antrasit.band</a>
    </div>
    <div class="grid videos" id="videos"></div>
  </section>
</main>

<footer class="wrap">
  <span data-i18n="footer">All source code is on</span>
  <a href="https://github.com/erenciracioglu-dotcom">GitHub</a>.
</footer>

<script>
const OWNER = 'erenciracioglu-dotcom';
const SITE = `https://${OWNER}.github.io`;
// Repos with Pages that should not appear as projects (e.g. this index itself).
const HIDDEN = new Set([`${OWNER}.github.io`]);

const T = {
  tr: {
    title: 'Tarayıcıda çalışan küçük dünyalar',
    lede: 'Oyunlar, enstrümanlar, simülasyonlar ve oyuncaklar. Hepsi kurulum gerektirmeden tarayıcıda açılır.',
    footer: 'Kaynak kodlarının tamamı',
    open: 'Aç', source: 'Kaynak', all: 'Hepsi', new: 'Yeni', videos: 'Antrasit Band AI Müzik Klipleri', clips: 'Müzik klipleri',
    tags: { game: 'Oyun', music: 'Müzik', sim: 'Simülasyon', art: 'Görsel', '4d': '4 boyut', map: 'Harita', tool: 'Araç', other: 'Diğer' }
  },
  en: {
    title: 'Small worlds that run in your browser',
    lede: 'Games, instruments, simulations and toys. Each one opens straight in the browser, nothing to install.',
    footer: 'All source code is on',
    open: 'Open', source: 'Source', all: 'All', new: 'New', videos: 'Antrasit Band AI Music Videos', clips: 'Music videos',
    tags: { game: 'Game', music: 'Music', sim: 'Simulation', art: 'Visual', '4d': '4D', map: 'Map', tool: 'Tool', other: 'Other' }
  }
};

// English by default; a choice made with the flags is remembered.
let lang = 'en';
try { lang = localStorage.getItem('lang') || 'en'; } catch (e) {}
if (!T[lang]) lang = 'en';
let filter = 'all';
let projects = [];
let videos = [];

const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (v != null) n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
};

function card(p) {
  const t = T[lang];
  const url = `${SITE}/${p.repo}/`;
  const img = el('img', { src: p.thumb, alt: p.title, loading: 'lazy', width: 960, height: 600 });
  img.onerror = () => img.replaceWith(el('span', { class: 'ph' }, p.title));
  return el('article', { class: 'card' },
    el('a', { class: 'shot', href: url, tabindex: '-1', 'aria-hidden': 'true' },
      img, p.auto ? el('span', { class: 'badge' }, t.new) : null),
    el('div', { class: 'body' },
      el('h2', {}, el('a', { href: url }, p.title)),
      el('div', { class: 'tags' }, ...p.tags.map(g => el('span', {}, t.tags[g] || g))),
      el('p', {}, p[lang] || p.tr || p.en || ''),
      el('div', { class: 'actions' },
        el('a', { class: 'btn primary', href: url }, `${t.open} ↗`),
        el('a', { class: 'btn', href: `https://github.com/${OWNER}/${p.repo}` }, t.source))));
}

function videoCard(v) {
  const url = `https://www.youtube.com/watch?v=${v.id}`;
  const title = v.title || 'Antrasit Band';
  const img = el('img', { src: `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`, alt: '', loading: 'lazy', width: 480, height: 270 });
  img.onerror = () => img.replaceWith(el('span', { class: 'ph' }, 'Antrasit Band'));
  return el('article', { class: 'card video' },
    el('a', { class: 'shot', href: url, tabindex: '-1', 'aria-hidden': 'true' }, img, el('span', { class: 'play' })),
    el('div', { class: 'body' }, el('h3', {}, el('a', { href: url }, title))));
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(n => { n.textContent = t[n.dataset.i18n]; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));

  const counts = {};
  projects.forEach(p => p.tags.forEach(g => { counts[g] = (counts[g] || 0) + 1; }));
  const nav = document.getElementById('filters');
  counts.all = projects.length + videos.length;
  if (videos.length) counts.clips = videos.length;
  const label = g => g === 'all' ? t.all : g === 'clips' ? t.clips : t.tags[g];
  nav.replaceChildren(...['all', ...Object.keys(t.tags), 'clips'].filter(g => counts[g]).map(g =>
    el('button', { type: 'button', 'aria-pressed': String(filter === g), 'data-f': g },
      label(g), el('span', { class: 'n' }, counts[g]))));

  const shown = filter === 'clips' ? [] : projects.filter(p => filter === 'all' || p.tags.includes(filter));
  const grid = document.getElementById('grid');
  grid.hidden = !shown.length;
  grid.replaceChildren(...shown.map(card));
  document.getElementById('videos-section').hidden = !videos.length || !(filter === 'all' || filter === 'clips');
  document.getElementById('videos').replaceChildren(...videos.map(videoCard));
}

document.getElementById('filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f; render();
});
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  render();
}));

// Curated list first; then any newer Pages repo that is not in the list yet
// shows up automatically, using its GitHub description and screenshot.png.
async function load() {
  try {
    const list = await (await fetch('projects.json')).json();
    projects = list.map(p => ({ ...p, thumb: p.thumb || `thumbs/${p.repo.toLowerCase()}.webp` }));
  } catch (e) { projects = []; }
  try { videos = await (await fetch('videos.json')).json(); } catch (e) { videos = []; }
  render();
  loadVideoTitles();

  try {
    const res = await fetch(`https://api.github.com/users/${OWNER}/repos?per_page=100&sort=created`);
    if (!res.ok) return;
    const known = new Set(projects.map(p => p.repo.toLowerCase()));
    const extra = (await res.json())
      .filter(r => r.has_pages && !r.fork && !r.archived && !HIDDEN.has(r.name) && !known.has(r.name.toLowerCase()))
      .map(r => ({
        repo: r.name,
        title: r.name.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()),
        tags: ['other'],
        tr: r.description, en: r.description,
        thumb: `${SITE}/${r.name}/screenshot.png`,
        auto: true
      }));
    if (extra.length) { projects = [...extra, ...projects]; render(); }
  } catch (e) { /* offline or rate-limited: the curated list is enough */ }
}
// Titles come live from YouTube (through noembed, which allows browser requests),
// so a renamed video shows its new name. A "title" in videos.json wins.
function loadVideoTitles() {
  videos.filter(v => !v.title).forEach(async v => {
    try {
      const url = encodeURIComponent(`https://www.youtube.com/watch?v=${v.id}`);
      const data = await (await fetch(`https://noembed.com/embed?url=${url}`)).json();
      if (data.title) { v.title = data.title; render(); }
    } catch (e) { /* keep the fallback title */ }
  });
}

load();
</script>
<script data-goatcounter="https://pagesindex.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
